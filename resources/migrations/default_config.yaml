version: "1.0"

pipeline:
  stages:
    - profile_scan
    - temp_profile_create
    - data_harvest
    - onedrive_extract
    - app_capture
    - new_profile_create
    - data_inject
    - profile_cleanup
    - final_validation
  reboot_between_stages: true
  max_retries_per_stage: 3
  timeout_minutes: 30

onedrive:
  enabled: true
  pause_before_harvest: true
  wait_for_drain_seconds: 120
  force_hydration: true
  strip_metadata: true
  detach_after_harvest: true

browsers:
  chrome: true
  edge: true
  firefox: true
  include_history: false
  include_extensions: true

outlook:
  enabled: true
  detect_pst: true
  detect_ost: true
  copy_pst: true
  export_profile_reg: true
  verify_with_scanpst: false

data:
  vault_root: "C:\\MigrationVault"
  include_appdata_roaming: false
  include_appdata_local: false
  safe_folders:
    - Desktop
    - Documents
    - Downloads
    - Pictures
    - Videos
    - Music
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - "Thumbs.db"
    - "$RECYCLE.BIN"
    - "System Volume Information"

logging:
  level: info
  audit_file: "wpre-audit.log"
  report_format: "json"

safety:
  dry_run: false
  safe_mode: false
  rollback_enabled: true
  integrity_check: true
  require_admin: true
